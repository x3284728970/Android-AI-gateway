name: Debug Compile

# 只做一件事：编译 app 模块，并把编译错误通过 commit comment 回传。
# 起因：Actions 日志接口会 302 到 Azure Blob，沙箱解析不了那个域名，
# 拿不到 "e: file://..." 这类真正的错误行，只能让 CI 自己把错误送回来。
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: 准备 sdk 与 keystore 占位
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 编译（不中断，日志全留）
        run: |
          set +e
          gradle :app:compileReleaseKotlin --console=plain > /tmp/build.log 2>&1
          echo "exit=$?"

      - name: 单元测试（不中断）
        run: |
          set +e
          gradle :core:test --console=plain >> /tmp/build.log 2>&1
          echo "exit=$?"

      - name: 回传错误到 commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          log = ""
          try:
              log = open("/tmp/build.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              log = "(no log)"

          errs = [l for l in log.splitlines() if l.startswith("e: ") or " error: " in l]
          if not errs:
              # 没有编译错误时，把测试报告里失败的用例与断言消息捞出来
              import glob, re
              parts = []
              for path in glob.glob("core/build/test-results/test/*.xml"):
                  try:
                      xml = open(path, encoding="utf-8", errors="replace").read()
                  except OSError:
                      continue
                  for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure[^>]*message="([^"]*)"', xml):
                      parts.append("FAIL " + m.group(1) + " :: " + m.group(2)[:600])
              if parts:
                  errs = parts[:20]
          if errs:
              body = "\n".join(errs[:40])
          else:
              body = log[-4000:]

          data = json.dumps({"body": "```\n" + body[:60000] + "\n```"}).encode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments"
          req = urllib.request.Request(url, data=data, method="POST")
          req.add_header("Authorization", f"Bearer {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("posted", r.status)
          except Exception as e:
              print("post failed", e)
          PY
